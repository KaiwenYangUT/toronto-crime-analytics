# Deploy to GitHub Pages. Runs automatically after the `ci` workflow succeeds for a push to main, and can still be run by hand
# (workflow_dispatch). Requires Settings > Pages > Source = "GitHub Actions". Because a push to main now publishes, the
# rule "ask before any push" in AGENTS.md also covers the deployment.
# The 20 MB Toronto basemap is committed (web/public/basemap/toronto.pmtiles); its checksum is verified below.
name: pages
on:
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # a manual run always deploys; an automatic one only when ci passed for a push (not a pull request)
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m venv .venv && .venv/bin/python -m pip install -r requirements.lock
      - run: make data
      - run: cd web && npm ci
      - run: echo "93f086e6378c522f802758e664a2cda8eb1a31cc4d0b2cd7bb49f38ff2bff445  web/public/basemap/toronto.pmtiles" | sha256sum -c -
      - run: .venv/bin/python tools/gen_web_data.py && cd web && npm run build && npm run package
      - run: node tools/check_bundle_size.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/site
      - id: deployment
        uses: actions/deploy-pages@v4
