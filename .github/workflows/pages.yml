# Deploy to GitHub Pages. Manual only (workflow_dispatch) so nothing deploys by accident; enable it only after the
# user approves the deploy and sets Settings > Pages > Source to "GitHub Actions". Written in P9, never run.
# The 20 MB Toronto basemap is committed (web/public/basemap/toronto.pmtiles); its checksum is verified below.
name: pages
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m venv .venv && .venv/bin/python -m pip install -r requirements.lock
      - run: make data
      - run: cd web && npm ci
      - run: echo "93f086e6378c522f802758e664a2cda8eb1a31cc4d0b2cd7bb49f38ff2bff445  web/public/basemap/toronto.pmtiles" | sha256sum -c -
      - run: .venv/bin/python tools/gen_web_data.py && cd web && npm run build && npm run package
      - run: node tools/check_bundle_size.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/site
      - id: deployment
        uses: actions/deploy-pages@v4
