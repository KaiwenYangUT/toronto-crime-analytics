# Deploy to GitHub Pages. Manual only (workflow_dispatch) so nothing deploys by accident; enable it only after the
# user approves the deploy and sets Settings > Pages > Source to "GitHub Actions". Written in P9, never run.
# OPEN: the 20 MB Toronto basemap is not committed and the publisher keeps daily builds only briefly, so
# tools/fetch_basemap.sh may fail here; decide to commit the verified file (or host it) before the first deploy.
name: pages
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m venv .venv && .venv/bin/python -m pip install -r requirements.lock
      - run: make data
      - run: cd web && npm ci
      - run: source tools/env.sh && bash tools/fetch_basemap.sh
      - run: .venv/bin/python tools/gen_web_data.py && cd web && npm run build && npm run package
      - run: node tools/check_bundle_size.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/site
      - id: deployment
        uses: actions/deploy-pages@v4
