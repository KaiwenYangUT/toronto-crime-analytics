[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "toronto-crime-analytics"
version = "0.1.0"
description = "Robbery vs other major property crime: reproducible reported-incident analysis"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["pipeline/src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
pythonpath = ["pipeline/src"]
